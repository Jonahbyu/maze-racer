<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>Maze Racer</title>
	<meta name="description" content="A fast-paced 3D maze racer with roguelike progression.">
	<meta property="og:title" content="Maze Racer">
	<meta property="og:description" content="A fast-paced 3D maze racer with roguelike progression.">
	<meta property="og:type" content="website">
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png">
	<link rel="apple-touch-icon" type="image/png" href="index.apple-touch-icon.png">

	<!--
		Collect every AudioContext the engine creates, so the PLAY click can
		resume them.

		This has to run BEFORE the engine script, which is why it sits in
		<head> rather than with the rest of the boot code: Godot builds its
		context during startup, and there is no other way to get a reference
		to it -- GodotAudio is module-internal and is not exposed on window.

		It is a Proxy on the construct trap rather than a wrapper function.
		The first version was `function Tracked(){...}` with
		`Tracked.prototype = Native.prototype`, which loses the constructor
		identity: `ctx instanceof AudioContext` goes false, and any engine or
		browser code branching on that takes the wrong path. Measured, it was NOT
		the cause of the silent-audio bug -- audio init and both worklets were
		fine either way -- so this is hardening, not a fix. The actual cause was
		the single-threaded mixer stalling; see audio/driver/output_latency.web
		in project.godot.

		A Proxy forwards construction to the real class untouched, so identity,
		instanceof and every per-instance accessor survive. Only the observation
		is added.
	-->
	<script>
	(function () {
		var Native = window.AudioContext || window.webkitAudioContext;
		if (!Native || typeof Proxy === "undefined") { return; }
		window.__godotAudioContexts = [];
		var handler = {
			construct: function (target, args, newTarget) {
				var ctx = Reflect.construct(target, args, newTarget);
				window.__godotAudioContexts.push(ctx);
				return ctx;
			}
		};
		if (window.AudioContext) {
			window.AudioContext = new Proxy(window.AudioContext, handler);
		}
		if (window.webkitAudioContext) {
			window.webkitAudioContext = new Proxy(window.webkitAudioContext, handler);
		}
	})();
	</script>

	<style>
		:root {
			--neon: #22d3ee;
			--ground: #05070d;
			--dim: #64748b;
		}
		* { box-sizing: border-box; }
		html, body {
			margin: 0; padding: 0; border: 0;
			height: 100%; overflow: hidden;
			background: var(--ground);
			color: #e2e8f0;
			font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
			touch-action: none;
		}
		#canvas {
			display: block; width: 100%; height: 100%;
			outline: none; border: 0;
		}
		#canvas:focus { outline: none; }

		/* The boot overlay sits above the canvas until the engine reports ready. */
		#boot {
			position: fixed; inset: 0; z-index: 10;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			gap: 1.6rem; padding: 2rem;
			background:
				radial-gradient(circle at 50% 40%, #0d1424 0%, var(--ground) 70%);
			text-align: center;
			transition: opacity .5s ease;
		}
		#boot.done { opacity: 0; pointer-events: none; }

		h1 {
			margin: 0; font-size: clamp(2rem, 7vw, 3.4rem);
			letter-spacing: .22em; text-transform: uppercase;
			font-weight: 600; color: #fff;
			text-shadow: 0 0 12px var(--neon), 0 0 38px rgba(34,211,238,.55);
		}
		.keys { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
		.keys div {
			border: 1px solid rgba(34,211,238,.35);
			border-radius: 6px; padding: .5rem .85rem;
			font-size: .78rem; color: #cbd5e1;
			background: rgba(34,211,238,.05);
		}
		.keys b { color: var(--neon); font-weight: 600; }

		/* Progress: indeterminate until the engine reports real byte totals. */
		#bar {
			width: min(420px, 78vw); height: 3px;
			background: rgba(148,163,184,.18);
			border-radius: 3px; overflow: hidden;
		}
		#fill {
			height: 100%; width: 0%;
			background: linear-gradient(90deg, var(--neon), #a5f3fc);
			box-shadow: 0 0 10px var(--neon);
			transition: width .25s ease;
		}
		#bar.indeterminate #fill {
			width: 35%; animation: slide 1.1s ease-in-out infinite;
		}
		@keyframes slide {
			0% { margin-left: -35%; } 100% { margin-left: 100%; }
		}
		#msg { color: var(--dim); font-size: .74rem; letter-spacing: .1em; min-height: 1.2em; }
		#play {
			margin-top: .4rem; cursor: pointer;
			background: transparent; color: var(--neon);
			border: 1px solid var(--neon); border-radius: 6px;
			padding: .8rem 2.4rem; font: inherit;
			font-size: .84rem; letter-spacing: .2em; text-transform: uppercase;
			box-shadow: 0 0 16px rgba(34,211,238,.28);
			transition: background .2s, color .2s;
		}
		#play:hover { background: var(--neon); color: #041018; }
		#play[hidden] { display: none; }
		.err { color: #f87171; max-width: 46ch; line-height: 1.5; font-size: .8rem; }
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="0">
		Your browser does not support the HTML5 canvas element.
	</canvas>

	<div id="boot">
		<h1>Maze Racer</h1>
		<div class="keys">
			<div><b>&larr;</b> turn left</div>
			<div><b>&rarr;</b> turn right</div>
			<div><b>&darr;</b> 180&deg; / un-stick</div>
		</div>
		<div id="bar" class="indeterminate"><div id="fill"></div></div>
		<div id="msg">Loading engine&hellip; (~12&nbsp;MB first visit)</div>
		<button id="play" hidden>Play</button>
	</div>

	<!--
		The leaderboard bridge (docs/plans/leaderboards.md).

		Godot has no Firebase SDK, so the SDK loads here and GDScript reaches it
		through JavaScriptBridge -- the same shape as the audio-unlock hook in
		<head>. Everything is namespaced under window.mazeRacerLB.

		Loaded BEFORE the engine so the bridge exists by the time any GDScript
		can call it, and every entry point is null-safe: a blocked CDN, no
		network, or a failed sign-in must leave the GAME completely playable and
		only the boards empty.

		The config is a public client identifier, not a secret -- access is
		controlled by Firestore rules. Same project as the cookbook.
	-->
	<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
	<script>
	(function () {
		var LB = {
			ready: false,
			error: '',
			uid: '',
			name: '',
			// Async results are parked here for GDScript to poll. The bridge
			// cannot call back INTO Godot, so every result is written to a slot
			// and picked up on a later frame.
			results: {}
		};
		window.mazeRacerLB = LB;

		var CONFIG = {
			apiKey: 'AIzaSyBMZoufa0sSfk6Dv_vgQ0xogB_16GgwMcI',
			authDomain: 'pistachio-kitchen.firebaseapp.com',
			projectId: 'pistachio-kitchen',
			storageBucket: 'pistachio-kitchen.firebasestorage.app',
			messagingSenderId: '720061481410',
			appId: '1:720061481410:web:f188eea83a51b4587dd65b'
		};

		// Namespaced under one root document so nothing here can collide with
		// the cookbook's own collections in the same project.
		var SCORES = 'mazeRacer/data/scores';
		var PLAYERS = 'mazeRacer/data/players';

		var db = null;

		if (typeof firebase === 'undefined') {
			LB.error = 'sdk-blocked';
		} else {
			try {
				firebase.initializeApp(CONFIG);
				db = firebase.firestore();
			} catch (e) {
				LB.error = 'init-failed';
				db = null;
			}
		}

		if (db) {
			// Anonymous, deliberately: nobody makes an account before their
			// first two-minute run, and a score that needs a signup to count is
			// a score that gets thrown away. The display name is asked for
			// separately, only when the player first posts.
			firebase.auth().onAuthStateChanged(function (user) {
				if (!user) { return; }
				LB.uid = user.uid;
				LB.ready = true;
				db.collection(PLAYERS).doc(user.uid).get().then(function (doc) {
					if (doc.exists && doc.data().name) { LB.name = doc.data().name; }
				}).catch(function () { /* name stays empty; the game asks */ });
			});

			firebase.auth().signInAnonymously().catch(function (e) {
				LB.error = 'auth-failed:' + (e && e.code ? e.code : 'unknown');
			});
		}

		LB.status = function () {
			return JSON.stringify({
				ready: LB.ready, error: LB.error, uid: LB.uid, name: LB.name
			});
		};

		LB.setName = function (name) {
			if (!LB.ready || !db) { return false; }
			LB.name = String(name).slice(0, 24);
			db.collection(PLAYERS).doc(LB.uid).set(
				{ name: LB.name, updatedAt: Date.now() }, { merge: true }
			).catch(function () { /* the local name still stands */ });
			return true;
		};

		// One score. The seed rides along with every entry so a suspicious run
		// can later be checked against the maze it claims to have driven --
		// which is what keeps a future replay-validation upgrade possible.
		LB.postScore = function (payload) {
			if (!LB.ready || !db) { return false; }
			var p;
			try { p = JSON.parse(payload); } catch (e) { return false; }

			var doc = {
				uid: LB.uid,
				name: LB.name || 'anon',
				score: Math.round(Number(p.score) || 0),
				timeSeconds: Number(p.time) || 0,
				seed: Number(p.seed) || 0,
				board: String(p.board || 'general'),
				mazesCleared: Number(p.mazes) || 0,
				died: !!p.died,
				createdAt: Date.now()
			};

			// Keyed by uid+seed on the shared boards, so one player holds one
			// entry per shared maze and cannot flood a board by replaying it.
			// The general board is any-seed, so each run is its own document.
			var id = (doc.board === 'general')
				? (LB.uid + '_' + doc.createdAt)
				: (LB.uid + '_' + doc.board + '_' + doc.seed);

			var ref = db.collection(SCORES).doc(id);
			LB.results.post = 'pending';

			// Best-of, not last: replaying a daily must never LOWER the entry
			// already standing, which a plain set() would do.
			ref.get().then(function (snap) {
				if (snap.exists && Number(snap.data().score) >= doc.score) {
					LB.results.post = 'kept';
					return null;
				}
				return ref.set(doc);
			}).then(function () {
				if (LB.results.post !== 'kept') { LB.results.post = 'ok'; }
			}).catch(function (e) {
				LB.results.post = 'error:' + (e && e.code ? e.code : 'unknown');
			});
			return true;
		};

		LB.postState = function () {
			return LB.results.post || '';
		};

		// Fetch a board. `sort` is 'score' (descending) or 'time' (ascending) --
		// it changes the QUERY, not just the display, or the top ten would be
		// the top ten by the wrong measure.
		LB.fetchBoard = function (board, sort, limit) {
			if (!LB.ready || !db) { return false; }
			LB.results.board = '';
			var q = db.collection(SCORES).where('board', '==', String(board));
			if (sort === 'time') {
				q = q.orderBy('timeSeconds', 'asc');
			} else {
				q = q.orderBy('score', 'desc');
			}
			q.limit(Number(limit) || 10).get().then(function (snap) {
				var rows = [];
				snap.forEach(function (d) {
					var v = d.data();
					rows.push({
						name: v.name || 'anon',
						score: v.score || 0,
						time: v.timeSeconds || 0,
						mazes: v.mazesCleared || 0,
						died: !!v.died
					});
				});
				LB.results.board = JSON.stringify({ ok: true, rows: rows });
			}).catch(function (e) {
				LB.results.board = JSON.stringify({
					ok: false, error: (e && e.code ? e.code : 'unknown'), rows: []
				});
			});
			return true;
		};

		LB.boardResult = function () {
			return LB.results.board || '';
		};

		// The player's own runs, newest first. Same collection, filtered by uid.
		LB.fetchHistory = function (limit) {
			if (!LB.ready || !db) { return false; }
			LB.results.history = '';
			db.collection(SCORES)
				.where('uid', '==', LB.uid)
				.orderBy('createdAt', 'desc')
				.limit(Number(limit) || 10)
				.get().then(function (snap) {
					var rows = [];
					snap.forEach(function (d) {
						var v = d.data();
						rows.push({
							score: v.score || 0,
							time: v.timeSeconds || 0,
							board: v.board || 'general',
							mazes: v.mazesCleared || 0,
							died: !!v.died,
							at: v.createdAt || 0
						});
					});
					LB.results.history = JSON.stringify({ ok: true, rows: rows });
				}).catch(function (e) {
					LB.results.history = JSON.stringify({
						ok: false, error: (e && e.code ? e.code : 'unknown'), rows: []
					});
				});
			return true;
		};

		LB.historyResult = function () {
			return LB.results.history || '';
		};
	})();
	</script>

	<script src="$GODOT_URL"></script>
	<script>
	(function () {
		var boot = document.getElementById('boot');
		var bar = document.getElementById('bar');
		var fill = document.getElementById('fill');
		var msg = document.getElementById('msg');
		var play = document.getElementById('play');
		var canvas = document.getElementById('canvas');

		function fail(text) {
			bar.style.display = 'none';
			play.hidden = true;
			msg.className = 'err';
			msg.textContent = text;
		}

		if (!('WebAssembly' in window)) {
			return fail('This browser has no WebAssembly support. Try a current Chrome, Edge, Firefox or Safari.');
		}

		var engine = new Engine($GODOT_CONFIG);

		// Autoplay policies block audio until a real gesture, and a canvas that
		// never received a click also never receives key events -- which reads
		// exactly like a frozen game. Starting behind a button avoids both.
		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0) {
					bar.classList.remove('indeterminate');
					fill.style.width = ((current / total) * 100).toFixed(1) + '%';
					msg.textContent = 'Loading ' + (current / 1048576).toFixed(1) +
						' / ' + (total / 1048576).toFixed(1) + ' MB';
				}
			},
			'onProgressiveStart': function () { /* engine booted */ }
		}).then(function () {
			bar.classList.remove('indeterminate');
			fill.style.width = '100%';
			msg.textContent = '';
			play.hidden = false;
			play.focus();
		}).catch(function (err) {
			fail('Failed to start: ' + err);
		});

		// Resume every AudioContext the engine created.
		//
		// This is what actually makes the game audible in a browser. Godot
		// creates its AudioContext during boot -- before any gesture -- so it
		// starts SUSPENDED under every browser's autoplay policy, and the
		// engine never resumes it on its own: measured over CDP, the context
		// was still "suspended" after both a click and a keypress, so the
		// music played into a dead context and the game shipped silent.
		//
		// Nothing in GDScript can fix this. AudioServer has no reach into the
		// context's suspended state, which is why every desktop harness and
		// probe passed against the same code.
		//
		// The contexts are collected by the constructor hook installed in
		// <head>, because the engine does not expose its own.
		function resumeAudio() {
			var list = window.__godotAudioContexts || [];
			for (var i = 0; i < list.length; i++) {
				if (list[i].state !== 'running') {
					list[i].resume().catch(function () { /* nothing to do */ });
				}
			}
		}

		play.addEventListener('click', function () {
			boot.classList.add('done');
			setTimeout(function () { boot.style.display = 'none'; }, 500);
			canvas.focus();
			resumeAudio();
		});

		// A belt-and-braces retry on any later gesture. The PLAY click is the
		// gesture that should unlock audio, but a context can be suspended
		// again by the browser -- a backgrounded tab is the common case -- and
		// a player who tabs away mid-run should not come back to silence.
		['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
			window.addEventListener(ev, resumeAudio, { capture: true });
		});
	})();
	</script>
</body>
</html>
